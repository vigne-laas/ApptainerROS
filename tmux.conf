# Souris : scroll, click pour changer de pane, drag pour resize, selection
set -g mouse on

# Index 1-based (plus naturel : Ctrl-b 1, 2, 3...)
set -g base-index 1
setw -g pane-base-index 1

# Pas de renommage automatique de fenetre (on garde les noms du tmuxinator)
set-option -g allow-rename off

# Historique scrollback
set -g history-limit 20000

# Couleurs / terminal
set -g default-terminal "screen-256color"

# Status bar minimale et lisible
set -g status-bg colour234
set -g status-fg colour245
set -g status-left '#[fg=colour39][#S] '
set -g status-right '#[fg=colour244]%H:%M '

# Toggle broadcast input sur tous les panes (utile pour killer plusieurs nodes)
bind-key B set-window-option synchronize-panes \; display "synchronize-panes: #{?synchronize-panes,ON,OFF}"

# Reload config a chaud
bind-key r source-file /etc/tmux.conf \; display "tmux.conf reloaded"

# Splits plus intuitifs (garde le cwd courant)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Navigation panes : Ctrl-b + flechess
bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R
